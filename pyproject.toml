[project]
name = "handtex"
version = "0.1.0"
description = "Turn note PDFs with handwriting (and slides) into LaTeX, diagrams as TikZ"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "pymupdf>=1.24",
]

[project.scripts]
handtex = "handtex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["handtex"]
